<!DOCTYPE html>
<html lang="is">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markorð: 141 - 150 algengustu í íslenskum námsbókum</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f0f4f8; 
            margin: 0;
            padding: 2vh 5vw; 
            min-height: 95vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .container { 
            width: 100%; 
            max-width: 1200px; 
            background: white; 
            padding: 30px 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-height: 100%;
            overflow-y: auto;
        }
        h1 {
            color: #1a73e8;
            font-size: 2em;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* Framvindustika */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            height: 20px;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #34a853;
            border-radius: 10px;
            transition: width 0.5s ease-in-out;
        }
        
        #counter { font-size: 1.2em; color: #666; font-weight: bold; margin-bottom: 10px; }

        .lang-selector {
            margin-bottom: 20px;
            background: #fff3e0;
            padding: 10px 15px;
            border-radius: 10px;
            display: inline-block;
            border: 1px solid #ffcc80;
        }

        .lang-selector select {
            padding: 8px;
            font-size: 1.1em;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
            margin-left: 10px;
            max-width: 300px;
        }
        
        #target { 
            font-size: 4em; 
            margin: 10px 0; 
            color: #222; 
            font-weight: bold;
        }
        
        #is-explanation {
            font-size: 1.2em;
            color: #333;
            background-color: #e8f0fe;
            padding: 15px 25px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            max-width: 80%;
            line-height: 1.6;
            text-align: left;
        }

        .btn { 
            padding: 12px 25px; 
            font-size: 1.2em; 
            margin: 5px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #1a73e8; 
            color: white; 
            transition: 0.3s; 
            font-weight: bold;
        }
        .btn:hover:not(:disabled) { background-color: #1557b0; transform: scale(1.02); }
        .recording { background-color: #d93025; animation: pulse 1.5s infinite; }
        .recording:hover { background-color: #b3140b; }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #media-box { 
            font-size: 1.1em; 
            color: #444; 
            text-align: left; 
            background: #f8fbff; 
            padding: 15px 30px; 
            border-radius: 12px; 
            line-height: 1.6; 
            border-left: 6px solid #1a73e8; 
            margin-top: 15px;
            display: inline-block;
            min-width: 70%;
        }
        #spoken {
            margin-top: 15px; 
            font-size: 1.4em;
            font-style: italic; 
            color: #555;
        }
        #result {
            font-weight: bold; 
            font-size: 1.8em; 
            margin-top: 5px; 
            color: #1a73e8;
        }
        .nav-btns { margin-top: 20px; }
        
        /* Fyrir nafnainnslátt */
        #studentName {
            font-size: 1.5em;
            padding: 10px;
            margin: 20px 0;
            width: 80%;
            max-width: 400px;
            border: 2px solid #1a73e8;
            border-radius: 8px;
            text-align: center;
        }

        .feedback-note {
            margin-top: 40px;
            font-size: 0.95em;
            color: #555;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        .feedback-note a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }
        .feedback-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>

    <div class="nav-btns">

    <div class="feedback-note">

</div>

<script>
const exerciseData = [
    { 
        text: "meira", 
        is_exp: "<b>Útskýring:</b> (Atviksorð / Lýsingarorð) Stigbreyting á 'mikið'. Þýðir stærra magn eða viðbót.<br><b>Andheiti:</b> minna.<br><br><b>Dæmi:</b> Viltu <b>meira</b> kaffi?",
        translations: {
            "ar": "<div dir='rtl'><b>الشرح:</b> (ظرف / صفة) صيغة التفضيل من 'كثير' (أكثر). تعني كمية أكبر أو إضافة.<br><b>مضاد:</b> minna (أقل).<br><b>مثال:</b> هل تريد <b>المزيد</b> من القهوة؟</div>",
            "be": "<b>Uitleg:</b> (Bijwoord / Bijvoeglijk naamwoord) Vergrotende trap van 'veel' (meer). Betekent een grotere hoeveelheid of een toevoeging.<br><b>Antoniem:</b> minna (minder).<br><b>Voorbeeld:</b> Wil je <b>meer</b> koffie?",
            "da": "<b>Forklaring:</b> (Biord / Tillægsord) Komparativ af 'meget' (mere). Betyder en større mængde eller en tilføjelse.<br><b>Antonym:</b> minna (mindre).<br><b>Eksempel:</b> Vil du have <b>mere</b> kaffe?",
            "en": "<b>Explanation:</b> (Adverb / Adjective) Comparative of 'much' (more). Means a larger amount or an addition.<br><b>Antonym:</b> minna (less).<br><b>Example:</b> Do you want <b>more</b> coffee?",
            "tl": "<b>Paliwanag:</b> (Pang-abay / Pang-uri) Higit sa 'marami' (mas marami/higit pa). Nangangahulugan ng mas malaking halaga o dagdag.<br><b>Kasalungat:</b> minna (mas kaunti).<br><b>Halimbawa:</b> Gusto mo ba ng <b>mas maraming (dagdag na)</b> kape?",
            "fi": "<b>Selitys:</b> (Adverbi / Adjektiivi) Komparatiivi sanasta 'paljon' (enemmän). Tarkoittaa suurempaa määrää tai lisäystä.<br><b>Vastakohta:</b> minna (vähemmän).<br><b>Esimerkki:</b> Haluatko <b>enemmän (lisää)</b> kahvia?",
            "fr": "<b>Explication:</b> (Adverbe / Adjectif) Comparatif de 'beaucoup' (plus). Signifie une plus grande quantité ou un ajout.<br><b>Antonyme:</b> minna (moins).<br><b>Exemple:</b> Veux-tu <b>plus</b> de café ?",
            "fo": "<b>Frágreiðing:</b> (Hjáorð / Lýsingarorð) Stigbroyting av 'nógv' (meira). Merkir størri nøgd ella okkurt afturat.<br><b>Andheiti:</b> minni.<br><b>Dømi:</b> Vilt tú hava <b>meira</b> kaffi?",
            "kl": "<b>Nassoqqaat:</b> (Oqaaseeraq / Pissusilerut) Amerlanerusut, suli.<br><b>Assersuut:</b> Kaffimik <b>suli</b> piumavit?",
            "nl": "<b>Uitleg:</b> (Bijwoord / Bijvoeglijk naamwoord) Vergrotende trap van 'veel' (meer). Betekent een grotere hoeveelheid of een toevoeging.<br><b>Antoniem:</b> minna (minder).<br><b>Voorbeeld:</b> Wil je <b>meer</b> koffie?",
            "it": "<b>Spiegazione:</b> (Avverbio / Aggettivo) Comparativo di 'molto' (più). Significa una quantità maggiore o un'aggiunta.<br><b>Antonimo:</b> minna (meno).<br><b>Esempio:</b> Vuoi <b>più</b> caffè?",
            "ja": "<b>説明:</b> (副詞 / 形容詞) 「たくさん」の比較級（もっと、より多く）。より多くの量や追加を意味します。<br><b>対義語:</b> minna (より少なく).<br><b>例文:</b> コーヒーを<b>もっと</b>いかがですか？",
            "zh": "<b>解释:</b> (副词 / 形容词) “多”的比较级（更多）。表示更大的数量或附加。<br><b>反义词:</b> minna（更少）。<br><b>例句:</b> 你想<b>再（更多）</b>要点咖啡吗？",
            "ku": "<b>Ravekirin:</b> (Hoker / Rengdêr) Berawirdiya 'pir' (zêdetir). Tê wateya mîqdarên mezintir an lêzêdekirinekê.<br><b>Dijwate:</b> minna (kêmtir).<br><b>Mînak:</b> Tu <b>zêdetir</b> qehwe dixwazî?",
            "lv": "<b>Paskaidrojums:</b> (Apstākļa vārds / Īpašības vārds) Pārākā pakāpe no 'daudz' (vairāk). Nozīmē lielāku daudzumu vai papildinājumu.<br><b>Antonīms:</b> minna (mazāk).<br><b>Piemērs:</b> Vai vēlies <b>vairāk</b> kafijas?",
            "lt": "<b>Paaiškinimas:</b> (Prievezmis / Būdvardis) Aukštesnysis laipsnis nuo 'daug' (daugiau). Reiškia didesnį kiekį ar papildymą.<br><b>Antonimas:</b> minna (mažiau).<br><b>Pavyzdys:</b> Ar nori <b>daugiau</b> kavos?",
            "no": "<b>Forklaring:</b> (Adverb / Adjektiv) Komparativ av 'mye' (mer). Betyr en større mengde eller et tillegg.<br><b>Antonym:</b> minna (mindre).<br><b>Eksempel:</b> Vil du ha <b>mer</b> kaffe?",
            "fa": "<div dir='rtl'><b>توضیح:</b> (قید / صفت) تفضیلی 'زیاد' (بیشتر). به معنی مقدار بزرگتر یا اضافه است.<br><b>متضاد:</b> minna (کمتر).<br><b>مثال:</b> آیا قهوه <b>بیشتری</b> می‌خواهی؟</div>",
            "pt": "<b>Explicação:</b> (Advérbio / Adjetivo) Comparativo de 'muito' (mais). Significa uma quantidade maior ou um acréscimo.<br><b>Antônimo:</b> minna (menos).<br><b>Exemplo:</b> Você quer <b>mais</b> café?",
            "pl": "<b>Wyjaśnienie:</b> (Przysłówek / Przymiotnik) Stopień wyższy od 'dużo' (więcej). Oznacza większą ilość lub dodatek.<br><b>Antonim:</b> minna (mniej).<br><b>Przykład:</b> Czy chcesz <b>więcej</b> kawy?",
            "ro": "<b>Explicație:</b> (Adverb / Adjectiv) Comparativul de la 'mult' (mai mult). Înseamnă o cantitate mai mare sau o adăugare.<br><b>Antonim:</b> minna (mai puțin).<br><b>Exemplu:</b> Vrei <b>mai multă</b> cafea?",
            "ru": "<b>Объяснение:</b> (Наречие / Прилагательное) Сравнительная степень от 'много' (больше/еще). Означает большее количество или добавку.<br><b>Антоним:</b> minna (меньше).<br><b>Пример:</b> Хочешь <b>еще (больше)</b> кофе?",
            "es": "<b>Explicación:</b> (Adverbio / Adjetivo) Comparativo de 'mucho' (más). Significa una cantidad mayor o una adición.<br><b>Antónimo:</b> minna (menos).<br><b>Ejemplo:</b> ¿Quieres <b>más</b> café?",
            "sv": "<b>Förklaring:</b> (Adverb / Adjektiv) Komparativ av 'mycket' (mer). Betyder en större mängd eller ett tillägg.<br><b>Antonym:</b> minna (mindre).<br><b>Exempel:</b> Vill du ha <b>mer</b> kaffe?",
            "th": "<b>คำอธิบาย:</b> (คำกริยาวิเศษณ์ / คำคุณศัพท์) ขั้นกว่าของ 'มาก' (มากกว่า/อีก) หมายถึงปริมาณที่เพิ่มขึ้นหรือส่วนเพิ่มเติม<br><b>คำตรงข้าม:</b> minna (น้อยกว่า)<br><b>ตัวอย่าง:</b> คุณต้องการกาแฟ<b>อีก (มากกว่านี้)</b> ไหม?",
            "de": "<b>Erklärung:</b> (Adverb / Adjektiv) Komparativ von 'viel' (mehr). Bedeutet eine größere Menge oder eine Zugabe.<br><b>Antonym:</b> minna (weniger).<br><b>Beispiel:</b> Möchtest du <b>mehr</b> Kaffee?",
            "uk": "<b>Пояснення:</b> (Прислівник / Прикметник) Вищий ступінь від 'багато' (більше/ще). Означає більшу кількість або додаток.<br><b>Антонім:</b> minna (менше).<br><b>Приклад:</b> Хочеш <b>ще (більше)</b> кави?",
            "vi": "<b>Giải thích:</b> (Trạng từ / Tính từ) So sánh hơn của 'nhiều' (nhiều hơn/thêm). Có nghĩa là một số lượng lớn hơn hoặc được thêm vào.<br><b>Từ trái nghĩa:</b> minna (ít hơn).<br><b>Ví dụ:</b> Bạn có muốn <b>thêm</b> cà phê không?"
        }
    },
    { 
        text: "dæmi", 
        is_exp: "<b>Útskýring:</b> (Nafnorð) Sýnishorn af einhverju eða eitthvað til að útskýra betur. Oft notað í 'til dæmis'.<br><br><b>Dæmi:</b> Geta allir nefnt eitt <b>dæmi</b>?",
        translations: {
            "ar": "<div dir='rtl'><b>الشرح:</b> (اسم) عينة من شيء ما أو شيء للشرح بشكل أفضل (مثال).<br><b>مثال:</b> هل يمكن للجميع ذكر <b>مثال</b> واحد؟</div>",
            "be": "<b>Uitleg:</b> (Zelfstandig naamwoord) Een voorbeeld van iets of iets om beter uit te leggen.<br><b>Voorbeeld:</b> Kan iedereen één <b>voorbeeld</b> noemen?",
            "da": "<b>Forklaring:</b> (Navneord) En prøve på noget eller noget til at forklare bedre (eksempel).<br><b>Eksempel:</b> Kan alle nævne ét <b>eksempel</b>?",
            "en": "<b>Explanation:</b> (Noun) A sample of something or something to explain better. Often used in 'til dæmis' (for example).<br><b>Example:</b> Can everyone name one <b>example</b>?",
            "tl": "<b>Paliwanag:</b> (Pangngalan) Isang sample ng isang bagay o isang bagay para mas maipaliwanag (halimbawa).<br><b>Halimbawa:</b> Maaari bang magbigay ang lahat ng isang <b>halimbawa</b>?",
            "fi": "<b>Selitys:</b> (Substantiivi) Näyte jostakin tai jotain, jolla selitetään paremmin (esimerkki).<br><b>Esimerkki:</b> Voivatko kaikki nimetä yhden <b>esimerkin</b>?",
            "fr": "<b>Explication:</b> (Nom) Un échantillon de quelque chose ou quelque chose pour mieux expliquer (exemple).<br><b>Exemple:</b> Est-ce que tout le monde peut donner un <b>exemple</b> ?",
            "fo": "<b>Frágreiðing:</b> (Navnorð) Eitt sýnishorn av onkrum ella okkurt til at greiða betur frá (dømi).<br><b>Dømi:</b> Kunnu øll nevna eitt <b>dømi</b>?",
            "kl": "<b>Nassoqqaat:</b> (Navneord) Assersuut.<br><b>Assersuut:</b> Kikkut tamarmik <b>assersuummik</b> ataatsimik taasaqarsinnaappat?",
            "nl": "<b>Uitleg:</b> (Zelfstandig naamwoord) Een voorbeeld van iets of iets om beter uit te leggen (voorbeeld).<br><b>Voorbeeld:</b> Kan iedereen één <b>voorbeeld</b> noemen?",
            "it": "<b>Spiegazione:</b> (Sostantivo) Un campione di qualcosa o qualcosa per spiegare meglio (esempio).<br><b>Esempio:</b> Tutti possono nominare un <b>esempio</b>?",
            "ja": "<b>説明:</b> (名詞) 何かの見本や、よりよく説明するためのもの（例）。<br><b>例文:</b> みんな、一つの<b>例</b>を挙げられますか？",
            "zh": "<b>解释:</b> (名词) 某物的样本或用来更好解释的事物（例子）。<br><b>例句:</b> 每个人都能举出一个<b>例子</b>吗？",
            "ku": "<b>Ravekirin:</b> (Navdêr) Mînakek ji tiştekî an tiştek ji bo çêtir ravekirinê (mînak).<br><b>Mînak:</b> Gelo her kes dikare <b>mînakekê</b> bide?",
            "lv": "<b>Paskaidrojums:</b> (Lietvārds) Kaut kā paraugs vai kaut kas, ko izmanto paskaidrošanai (piemērs).<br><b>Piemērs:</b> Vai visi var nosaukt vienu <b>piemēru</b>?",
            "lt": "<b>Paaiškinimas:</b> (Daiktavardis) Kažko pavyzdys ar kažkas, kas padeda geriau paaiškinti (pavyzdys).<br><b>Pavyzdys:</b> Ar visi gali pateikti vieną <b>pavyzdį</b>?",
            "no": "<b>Forklaring:</b> (Substantiv) En prøve på noe eller noe for å forklare bedre (eksempel).<br><b>Eksempel:</b> Kan alle nevne ett <b>eksempel</b>?",
            "fa": "<div dir='rtl'><b>توضیح:</b> (اسم) نمونه‌ای از چیزی یا چیزی برای توضیح بهتر (مثال).<br><b>مثال:</b> آیا همه می‌توانند یک <b>مثال</b> نام ببرند؟</div>",
            "pt": "<b>Explicação:</b> (Substantivo) Uma amostra de algo ou algo para explicar melhor (exemplo).<br><b>Exemplo:</b> Todos podem dar um <b>exemplo</b>?",
            "pl": "<b>Wyjaśnienie:</b> (Rzeczownik) Próbka czegoś lub coś do lepszego wyjaśnienia (przykład).<br><b>Przykład:</b> Czy każdy może podać jeden <b>przykład</b>?",
            "ro": "<b>Explicație:</b> (Substantiv) O mostră din ceva sau ceva pentru a explica mai bine (exemplu).<br><b>Exemplu:</b> Poate toată lumea să dea un <b>exemplu</b>?",
            "ru": "<b>Объяснение:</b> (Существительное) Образец чего-то или то, что служит для лучшего объяснения (пример).<br><b>Пример:</b> Может ли каждый назвать один <b>пример</b>?",
            "es": "<b>Explicación:</b> (Sustantivo) Una muestra de algo o algo para explicar mejor (ejemplo).<br><b>Ejemplo:</b> ¿Pueden todos nombrar un <b>ejemplo</b>?",

            "ru": "<b>Объяснение:</b><br>1. (Существительное) Означает 'раз' в дательном падеже (например, на этот раз).<br>2. (Притяжательное местоимение) Указывает на принадлежность подлежащему в дат. падеже.<br><b>Пример 1:</b> На этот <b>раз</b> всё прошло хорошо.<br><b>Пример 2:</b> Она была у <b>своей</b> бабушки.",

    { 
        text: "stundum",

        translations: {
            "ar": "<div dir='rtl'><b>الشرح:</b> (ظرف) شيء يحدث من وقت لآخر، وليس دائماً (أحياناً).<br><b>مضاد:</b> دائماً، أبداً.<br><b>مثال:</b> نذهب <b>أحياناً</b> إلى السينما.</div>",
            "be": "<b>Uitleg:</b> (Bijwoord) Iets dat af en toe gebeurt, maar niet altijd (soms).<br><b>Antoniem:</b> altijd, nooit.<br><b>Voorbeeld:</b> We gaan <b>soms</b> naar de bioscoop.",
            "da": "<b>Forklaring:</b> (Biord) Noget, der sker af og til, men ikke altid (nogle gange/undertiden).<br><b>Antonym:</b> altid, aldrig.<br><b>Eksempel:</b> Vi tager <b>nogle gange</b> i biografen.",
            "en": "<b>Explanation:</b> (Adverb) Something that happens now and then, but not always (sometimes).<br><b>Antonym:</b> always, never.<br><b>Example:</b> We <b>sometimes</b> go to the cinema.",

            "fr": "<b>Explication:</b> (Adverbe) Quelque chose qui arrive de temps en temps, mais pas toujours (parfois).<br><b>Antonyme:</b> toujours, jamais.<br><b>Exemple:</b> Nous allons <b>parfois</b> au cinéma.",
            "fo": "<b>Frágreiðing:</b> (Hjáorð) Okkurt sum hendir viðhvørt, men ikki altíð (viðhvørt).<br><b>Andheiti:</b> altíð, ongantíð.<br><b>Dømi:</b> Vit fara <b>viðhvørt</b> í biograf.",
            "kl": "<b>Nassoqqaat:</b> (Udsagnsord) Ilaanni.<br><b>Assersuut:</b> <b>Ilaanni</b> isiginnaariartarpugut.",
            "nl": "<b>Uitleg:</b> (Bijwoord) Iets dat af en toe gebeurt, maar niet altijd (soms).<br><b>Antoniem:</b> altijd, nooit.<br><b>Voorbeeld:</b> We gaan <b>soms</b> naar de bioscoop.",
            "it": "<b>Spiegazione:</b> (Avverbio) Qualcosa che accade di tanto in tanto, ma non sempre (a volte).<br><b>Antonimo:</b> sempre, mai.<br><b>Esempio:</b> Andiamo <b>a volte</b> al cinema.",
            "ja": "<b>説明:</b> (副詞) 時々起こるが、いつもではないこと（時々）。<br><b>対義語:</b> いつも、決して～ない。<br><b>例文:</b> 私たちは<b>時々</b>映画に行きます。",
            "zh": "<b>解释:</b> (副词) 时而发生，但不总是发生的事情（有时）。<br><b>反义词:</b> 总是，从不。<br><b>例句:</b> 我们<b>有时</b>去电影院。",

            "lv": "<b>Paskaidrojums:</b> (Apstākļa vārds) Kaut kas, kas notiek šad un tad, bet ne vienmēr (dažreiz).<br><b>Antonīms:</b> vienmēr, nekad.<br><b>Piemērs:</b> Mēs <b>dažreiz</b> ejam uz kino.",
            "lt": "<b>Paaiškinimas:</b> (Prievezmis) Kažkas, kas nutinka retkarčiais, bet ne visada (kartais).<br><b>Antonimas:</b> visada, niekada.<br><b>Pavyzdys:</b> Mes <b>kartais</b> einame į kiną.",
            "no": "<b>Forklaring:</b> (Adverb) Noe som skjer av og til, men ikke alltid (noen ganger / iblant).<br><b>Antonym:</b> alltid, aldri.<br><b>Eksempel:</b> Vi drar <b>iblant (noen ganger)</b> på kino.",
            "fa": "<div dir='rtl'><b>توضیح:</b> (قید) چیزی که گاه و بیگاه رخ می‌دهد، اما نه همیشه (گاهی اوقات).<br><b>متضاد:</b> همیشه، هرگز.<br><b>مثال:</b> ما <b>گاهی اوقات</b> به سینما می‌رویم.</div>",
            "pt": "<b>Explicação:</b> (Advérbio) Algo que acontece de vez em quando, mas não sempre (às vezes).<br><b>Antônimo:</b> sempre, nunca.<br><b>Exemplo:</b> Nós <b>às vezes</b> vamos ao cinema.",
            "pl": "<b>Wyjaśnienie:</b> (Przysłówek) Coś, co dzieje się od czasu do czasu, ale nie zawsze (czasami).<br><b>Antonim:</b> zawsze, nigdy.<br><b>Przykład:</b> <b>Czasami</b> chodzimy do kina.",
            "ro": "<b>Explicație:</b> (Adverb) Ceva care se întâmplă din când în când, dar nu mereu (uneori).<br><b>Antonim:</b> întotdeauna, niciodată.<br><b>Exemplu:</b> Mergem <b>uneori</b> la cinema.",
            "ru": "<b>Объяснение:</b> (Наречие) То, что случается время от времени, но не всегда (иногда).<br><b>Антоним:</b> всегда, никогда.<br><b>Пример:</b> Мы <b>иногда</b> ходим в кино.",
            "es": "<b>Explicación:</b> (Adverbio) Algo que pasa de vez en cuando, pero no siempre (a veces).<br><b>Antónimo:</b> siempre, nunca.<br><b>Ejemplo:</b> Nosotros <b>a veces</b> vamos al cine.",
            "sv": "<b>Förklaring:</b> (Adverb) Något som händer då och då, men inte alltid (ibland).<br><b>Antonym:</b> alltid, aldrig.<br><b>Exempel:</b> Vi går <b>ibland</b> på bio.",
            "th": "<b>คำอธิบาย:</b> (คำกริยาวิเศษณ์) สิ่งที่เกิดขึ้นเป็นบางครั้งบางคราว แต่ไม่เสมอไป (บางครั้ง)<br><b>คำตรงข้าม:</b> เสมอ, ไม่เคย<br><b>ตัวอย่าง:</b> พวกเราไปดูหนังเป็น<b>บางครั้ง</b>",
            "de": "<b>Erklärung:</b> (Adverb) Etwas, das ab und zu passiert, aber nicht immer (manchmal).<br><b>Antonym:</b> immer, nie.<br><b>Beispiel:</b> Wir gehen <b>manchmal</b> ins Kino.",

            "vi": "<b>Giải thích:</b> (Trạng từ) Điều gì đó xảy ra thỉnh thoảng, nhưng không phải luôn luôn (đôi khi).<br><b>Từ trái nghĩa:</b> luôn luôn, không bao giờ.<br><b>Ví dụ:</b> Chúng tôi <b>đôi khi</b> đi xem phim."

    { 
        text: "annað",

        translations: {
            "ar": "<div dir='rtl'><b>الشرح:</b> (ضمير نكرة) شيء ليس هو نفسه، أو شيء إضافي (للمحايد).<br><b>مثال:</b> هل تريد شيئاً <b>آخر</b> لتأكله؟</div>",
            "be": "<b>Uitleg:</b> (Onbepaald voornaamwoord) Iets dat niet hetzelfde is, of iets extra's (onzijdig).<br><b>Voorbeeld:</b> Wil je iets <b>anders</b> te eten?",
            "da": "<b>Forklaring:</b> (Ubestemt stedord) Noget der ikke er det samme, eller noget mere (intetkøn).<br><b>Eksempel:</b> Vil du have noget <b>andet</b> at spise?",
            "en": "<b>Explanation:</b> (Indefinite pronoun) Something that is not the same, or something extra (neuter).<br><b>Example:</b> Do you want something <b>else (other)</b> to eat?",

            "fr": "<b>Explication:</b> (Pronom indéfini) Quelque chose qui n'est pas pareil, ou quelque chose de plus (neutre).<br><b>Exemple:</b> Veux-tu <b>autre chose</b> à manger ?",
            "fo": "<b>Frágreiðing:</b> (Óvíst fornavn) Okkurt sum ikki er tað sama, ella okkurt meira (hvørkikyn).<br><b>Dømi:</b> Vilt tú hava okkurt <b>annað</b> at eta?",
            "kl": "<b>Nassoqqaat:</b> (Fornavn) Allamik.<br><b>Assersuut:</b> <b>Allamik</b> nererusuppit?",
            "nl": "<b>Uitleg:</b> (Onbepaald voornaamwoord) Iets dat niet hetzelfde is, of iets extra's (onzijdig).<br><b>Voorbeeld:</b> Wil je iets <b>anders</b> te eten?",
            "it": "<b>Spiegazione:</b> (Pronome indefinito) Qualcosa che non è lo stesso, o qualcosa in più (neutro).<br><b>Esempio:</b> Vuoi qualcos'<b>altro</b> da mangiare?",

            "zh": "<b>解释:</b> (不定代词) 不一样的东西，或者额外的某物（中性：其他的）。<br><b>例句:</b> 你想吃点<b>别的（其他的）</b>吗？",
            "ku": "<b>Ravekirin:</b> (Cînavka nediyar) Tiştek ku ne heman e, an tiştek din e (nêtar).<br><b>Mînak:</b> Tu tiştekî <b>din</b> ji bo xwarinê dixwazî?",
            "lv": "<b>Paskaidrojums:</b> (Nenoteiktais vietniekvārds) Kaut kas, kas nav tas pats, vai kaut kas papildu (nekatrā dzimtē).<br><b>Piemērs:</b> Vai tu gribi ēst kaut ko <b>citu</b>?",
            "lt": "<b>Paaiškinimas:</b> (Neapibrėžtasis įvardis) Kažkas, kas nėra tas pats, ar kažkas papildomo (bevardė giminė).<br><b>Pavyzdys:</b> Ar nori kažko <b>kito</b> valgyti?",
            "no": "<b>Forklaring:</b> (Ubestemt pronomen) Noe som ikke er det samme, eller noe mer (intetkjønn).<br><b>Eksempel:</b> Vil du ha noe <b>annet</b> å spise?",
            "fa": "<div dir='rtl'><b>توضیح:</b> (ضمیر نامعین) چیزی که یکسان نیست، یا چیز اضافه (خنثی: دیگر/متفاوت).<br><b>مثال:</b> آیا چیز <b>دیگری</b> برای خوردن می‌خواهی؟</div>",
            "pt": "<b>Explicação:</b> (Pronome indefinido) Algo que não é o mesmo, ou algo a mais (neutro: outro/a).<br><b>Exemplo:</b> Você quer <b>outra coisa</b> para comer?",
            "pl": "<b>Wyjaśnienie:</b> (Zaimek nieokreślony) Coś, co nie jest takie samo, lub coś dodatkowego (rodzaj nijaki: inne).<br><b>Przykład:</b> Chcesz coś <b>innego</b> do jedzenia?",
            "ro": "<b>Explicație:</b> (Pronume nehotărât) Ceva care nu este la fel, sau ceva în plus (neutru: altceva).<br><b>Exemplu:</b> Vrei <b>altceva</b> de mâncare?",
            "ru": "<b>Объяснение:</b> (Неопределенное местоимение) То, что не является тем же самым, или что-то дополнительное (средний род: другое).<br><b>Пример:</b> Хочешь что-нибудь <b>другое</b> поесть?",
            "es": "<b>Explicación:</b> (Pronombre indefinido) Algo que no es igual, o algo extra (neutro: otro/otra cosa).<br><b>Ejemplo:</b> ¿Quieres <b>otra cosa</b> para comer?",
            "sv": "<b>Förklaring:</b> (Obestämt pronomen) Något som inte är detsamma, eller något extra (neutrum: annat).<br><b>Exempel:</b> Vill du ha något <b>annat</b> att äta?",
            "th": "<b>คำอธิบาย:</b> (สรรพนามไม่ชี้เฉพาะ) สิ่งที่ไม่เหมือนเดิม หรือสิ่งเพิ่มเติม (เพศกลาง: อื่นๆ)<br><b>ตัวอย่าง:</b> คุณต้องการกินอะไร<b>อย่างอื่น</b>ไหม?",
            "de": "<b>Erklärung:</b> (Indefinitpronomen) Etwas, das nicht dasselbe ist, oder etwas Zusätzliches (Neutrum: anderes).<br><b>Beispiel:</b> Möchtest du etwas <b>anderes</b> essen?",
            "uk": "<b>Пояснення:</b> (Неозначений займенник) Те, що не є тим самим, або щось додаткове (середній рід: інше).<br><b>Приклад:</b> Хочеш щось <b>інше</b> поїсти?",
            "vi": "<b>Giải thích:</b> (Đại từ bất định) Một cái gì đó không giống nhau, hoặc một cái gì đó thêm vào (giống trung: cái khác).<br><b>Ví dụ:</b> Bạn có muốn ăn món gì <b>khác</b> không?"
        }

        translations: {

            "pt": "<b>Explicação:</b> (Pronome possessivo) Refere-se à posse pelo sujeito da frase. Aqui no caso acusativo.<br><b>Exemplo:</b> Ele encontrou o <b>seu (próprio)</b> livro.",

            "sv": "<b>Förklaring:</b> (Possessivt pronomen) Visar ägarskap för subjektet i meningen. Här i ackusativ.<br><b>Exempel:</b> Han hittade <b>sin</b> bok.",

            "de": "<b>Erklärung:</b> (Possessivpronomen) Bezieht sich auf den Besitz des Subjekts des Satzes. Hier im Akkusativ.<br><b>Beispiel:</b> Er fand <b>sein (eigenes)</b> Buch.",
            "uk": "<b>Пояснення:</b> (Присвійний займенник) Вказує на приналежність підмету речення. Тут у знахідному відмінку.<br><b>Приклад:</b> Він знайшов <b>свою</b> книгу.",

            "be": "<b>Uitleg:</b> (Bijwoord) Iets dat altijd gebeurt of onafgebroken doorgaat (altijd).<br><b>Antoniem:</b> aldrei (nooit).<br><b>Voorbeeld:</b> Hij is <b>altijd</b> blij.",

            "fr": "<b>Explication:</b> (Adverbe) Quelque chose qui se passe tout le temps ou continuellement (toujours).<br><b>Antonyme:</b> aldrei (jamais).<br><b>Exemple:</b> Il est <b>toujours</b> heureux.",

            "kl": "<b>Nassoqqaat:</b> (Udsagnsord) Tamatigut.<br><b>Assersuut:</b> <b>Tamatigut</b> qiimasarpoq.",
            "nl": "<b>Uitleg:</b> (Bijwoord) Iets dat altijd gebeurt of onafgebroken doorgaat (altijd).<br><b>Antoniem:</b> aldrei (nooit).<br><b>Voorbeeld:</b> Hij is <b>altijd</b> blij.",
            "it": "<b>Spiegazione:</b> (Avverbio) Qualcosa che accade tutto il tempo o continuamente (sempre).<br><b>Antonimo:</b> aldrei (mai).<br><b>Esempio:</b> Lui è <b>sempre</b> felice.",
            "ja": "<b>説明:</b> (副詞) 常に、または継続的に起こること（いつも）。<br><b>対義語:</b> aldrei (決して～ない).<br><b>例文:</b> 彼は<b>いつも</b>幸せです。",
            "zh": "<b>解释:</b> (副词) 一直发生或持续不断的事情（总是）。<br><b>反义词:</b> aldrei（从不）。<br><b>例句:</b> 他<b>总是</b>很高兴。",

            "lt": "<b>Paaiškinimas:</b> (Prievezmis) Kažkas, kas vyksta visą laiką arba nuolat (visada).<br><b>Antonimas:</b> aldrei (niekada).<br><b>Pavyzdys:</b> Jis <b>visada</b> yra laimingas.",

            "pt": "<b>Explicação:</b> (Advérbio) Algo que acontece o tempo todo ou continuamente (sempre).<br><b>Antônimo:</b> aldrei (nunca).<br><b>Exemplo:</b> Ele está <b>sempre</b> feliz.",
            "pl": "<b>Wyjaśnienie:</b> (Przysłówek) Coś, co dzieje się cały czas lub nieprzerwanie (zawsze).<br><b>Antonim:</b> aldrei (nigdy).<br><b>Przykład:</b> On jest <b>zawsze</b> szczęśliwy.",
            "ro": "<b>Explicație:</b> (Adverb) Ceva care se întâmplă tot timpul sau continuu (întotdeauna/mereu).<br><b>Antonim:</b> aldrei (niciodată).<br><b>Exemplu:</b> El este <b>mereu</b> fericit.",
            "ru": "<b>Объяснение:</b> (Наречие) То, что происходит все время или непрерывно (всегда).<br><b>Антоним:</b> aldrei (никогда).<br><b>Пример:</b> Он <b>всегда</b> счастлив.",
            "es": "<b>Explicación:</b> (Adverbio) Algo que sucede todo el tiempo o continuamente (siempre).<br><b>Antónimo:</b> aldrei (nunca).<br><b>Ejemplo:</b> Él <b>siempre</b> está feliz.",
            "sv": "<b>Förklaring:</b> (Adverb) Något som händer hela tiden eller oavbrutet (alltid).<br><b>Antonym:</b> aldrei (aldrig).<br><b>Exempel:</b> Han är <b>alltid</b> glad.",
            "th": "<b>คำอธิบาย:</b> (คำกริยาวิเศษณ์) สิ่งที่เกิดขึ้นตลอดเวลาหรืออย่างต่อเนื่อง (เสมอ)<br><b>คำตรงข้าม:</b> aldrei (ไม่เคย)<br><b>ตัวอย่าง:</b> เขาเป็นคนร่าเริง<b>เสมอ</b>",
            "de": "<b>Erklärung:</b> (Adverb) Etwas, das immer oder ununterbrochen passiert (immer).<br><b>Antonym:</b> aldrei (nie).<br><b>Beispiel:</b> Er ist <b>immer</b> glücklich.",
            "uk": "<b>Пояснення:</b> (Прислівник) Те, що відбувається весь час або постійно (завжди).<br><b>Антонім:</b> aldrei (ніколи).<br><b>Приклад:</b> Він <b>завжди</b> щасливий.",
            "vi": "<b>Giải thích:</b> (Trạng từ) Điều gì đó xảy ra mọi lúc hoặc liên tục (luôn luôn).<br><b>Từ trái nghĩa:</b> aldrei (không bao giờ).<br><b>Ví dụ:</b> Anh ấy <b>luôn</b> vui vẻ."
        }
    }
];

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;
let hasDownloadedCert = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI(); 
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) {
            correctCount++;
        }
    }
    const percent = (correctCount / exerciseData.length) * 100;
    
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) {
        progressBar.style.width = percent + '%';
    }
    return correctCount;
}

function findNextUnfinished() {
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;
            break;
        }
    }
    
    document.getElementById('app').innerHTML = `
        <h1>Markorð: 141 - 150 algengustu í íslenskum námsbókum</h1>
        <div class="progress-container"><div id="progress-bar"></div></div>
        
        <div class="lang-selector">
            <label for="languageSelect"><b>🌍 Tungumál:</b></label>
            <select id="languageSelect" onchange="updateUI()">
                <option value="" selected disabled>Veldu tungumál...</option>
                <option value="ar">Arabíska – العربية</option>
                <option value="be">Belgíska (Flæmska) – Vlaams</option>
                <option value="da">Danska – Dansk</option>
                <option value="en">Enska – English</option>
                <option value="tl">Filippseyska – Tagalog</option>
                <option value="fi">Finnska – Suomi</option>
                <option value="fr">Franska – Français</option>
                <option value="fo">Færeyska – Føroyskt</option>
                <option value="kl">Grænlenska – Kalaallisut</option>
                <option value="nl">Hollenska – Nederlands</option>
                <option value="it">Ítalska – Italiano</option>
                <option value="ja">Japanska – 日本語</option>
                <option value="zh">Kínverska – 中文</option>
                <option value="ku">Kúrdíska – Kurdî</option>
                <option value="lv">Lettneska – Latviešu</option>
                <option value="lt">Litháíska – Lietuvių</option>
                <option value="no">Norska – Norsk</option>
                <option value="fa">Persneska – فارسی</option>
                <option value="pt">Portúgalska – Português</option>
                <option value="pl">Pólska – Polski</option>
                <option value="ro">Rúmenska – Română</option>
                <option value="ru">Rússneska – Русский</option>
                <option value="es">Spænska – Español</option>
                <option value="sv">Sænska – Svenska</option>
                <option value="th">Tælenska – ภาษาไทย</option>
                <option value="de">Þýska – Deutsch</option>
                <option value="uk">Úkraínska – Українська</option>
                <option value="vi">Víetnamska – Tiếng Việt</option>
            </select>
        </div>

        <div id="counter"></div>
        <div id="target"></div>
        <div id="is-explanation"></div>
        <br>
        <button id="record-btn" class="btn" onclick="toggleRecord()">🎤 Tala</button>
        <div id="spoken"></div>
        <div id="result"></div>
        <div id="media-box"></div>
        <div class="nav-btns">
            <button class="btn" style="background-color: #5f6368;" onclick="prevExercise()">⬅️ Fyrri</button>
            <button class="btn" style="background-color: #5f6368;" onclick="nextExercise()">Næsta ➡️</button>
        </div>
        <div class="feedback-note">
            Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
        </div>
    `;
    updateUI();
}

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        if (correctCount === exerciseData.length) {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>
                <h1 style="color: #34a853; font-size: 2.5em;">Frábært! Þú náðir 100% árangri! 🎉</h1>
                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off" ${hasDownloadedCert ? 'disabled' : ''}><br>
                <button id="cert-btn" class="btn" style="background-color: ${hasDownloadedCert ? '#5f6368' : '#1a73e8'}; font-size: 1.5em; padding: 15px 30px; margin-top: 10px; cursor: ${hasDownloadedCert ? 'not-allowed' : 'pointer'}; opacity: ${hasDownloadedCert ? '0.7' : '1'};" onclick="downloadCert()" ${hasDownloadedCert ? 'disabled' : ''}>
                    ${hasDownloadedCert ? '✅ Skjal sótt' : '🏆 Sækja viðurkenningarskjal'}
                </button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja nýja umferð</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        } else {
            document.getElementById('app').innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
                <div class="feedback-note">
                    Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a>
                </div>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    
    const langSelect = document.getElementById('languageSelect');
    const selectedLang = langSelect ? langSelect.value : '';

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af${exerciseData.length}`;
    
    if (!selectedLang) {
        document.getElementById('media-box').innerHTML = "<i>Veldu tungumál úr listanum að ofan til að sjá þýðingu.</i>";
    } else {
        document.getElementById('media-box').innerHTML = curr.translations[selectedLang] || "Þýðing ekki til / Translation missing";
    }

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript;
        spoken = spoken.trim().toLowerCase(); 

        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        
        let score = (spoken === targetWord) ? 100 : 0;
        
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;

        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return; 

    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Markorð: 141 - 150 algengustu í íslenskum námsbókum', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
    if (studentNameInput) {
        studentNameInput.disabled = true;
    }
}
</script>

</body>
</html>
